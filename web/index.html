<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="preload" as="style" onload="this.rel='stylesheet'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="preload" as="style" onload="this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    </noscript>

    <title>EduFlow LMS</title>
    <meta name="description" content="EduFlow is a modern learning management system offering interactive courses, live sessions, and comprehensive learning tools." />
    <meta name="keywords" content="LMS, learning management system, online courses, e-learning, education" />
    <meta name="author" content="EduFlow" />
    <meta property="og:title" content="EduFlow LMS" />
    <meta property="og:description" content="Modern learning management system with interactive courses and live sessions." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduFlow LMS" />
    <meta name="twitter:description" content="Modern learning management system with interactive courses and live sessions." />
    <link rel="preload" href="/logo.svg" as="image" />
    <script>
      (function() {
        const theme = localStorage.getItem('eduflow-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
